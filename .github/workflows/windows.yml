name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure C toolchain
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"$env:MSYS2_LOCATION\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Test and vet
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          go test -race -tags ci,migrated_fynedo,no_emoji ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags ci,migrated_fynedo,no_emoji ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build single executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RegexFileExtractor-windows-amd64
          path: |
            dist/RegexFileExtractor.exe
            dist/SHA256SUMS.txt
